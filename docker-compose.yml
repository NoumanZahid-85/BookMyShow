# Whole system (UI, API, nginx, Mongo, Redis, Prometheus, Grafana, sample data):
#   docker compose up -d --build
# Infra only, with the API and UI running on your machine (local dev):
#   BACKEND_HOST=host.docker.internal:8000 docker compose up -d mongodb redis nginx prometheus grafana
# Optional extras: docker compose --profile search --profile messaging up -d

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bms-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development # also creates the demo admin account
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    depends_on:
      - mongodb
      - redis

  # One-off: fills an empty database with cities, cinemas, shows and sample bookings, then exits.
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bms-seed
    environment:
      MONGO_URI: mongodb://mongodb:27017
    command: sh -c "python scripts/seed.py --if-empty && python scripts/seed_more.py"
    depends_on:
      - mongodb
    restart: "no"

  web:
    build:
      context: ./frontend
      args:
        API_PROXY_URL: http://nginx:8080
    container_name: bms-web
    restart: always
    ports:
      - "${WEB_PORT:-3001}:3001" # set WEB_PORT if 3001 is taken
    depends_on:
      - api
      - nginx

  mongodb:
    image: mongo:7.0
    container_name: bms-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bookmyshow
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: bms-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: bms-elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    profiles: ["search", "full"]

  kafka:
    image: apache/kafka:3.7.0
    container_name: bms-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    profiles: ["messaging", "full"]

  nginx:
    image: nginx:alpine
    container_name: bms-nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # Rendered from a template so the backend address can change; only ${BACKEND_HOST} is replaced.
      - ./docker/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-api:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: bms-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: bms-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mongo_data:
  redis_data:
  elastic_data:
  kafka_data:

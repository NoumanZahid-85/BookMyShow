<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The life of a seat: pick, hold, broadcast, pay, ticket, gate scan</title>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>

  <rect width="960" height="440" rx="20" fill="#0d1117"/>
  <text x="30" y="50" fill="#e6edf3" font-size="22" font-weight="700">The life of a seat</text>
  <text x="30" y="76" fill="#8b95a7" font-size="14">Fifty people tap seat C01 at the same moment. Here is what happens next.</text>

  <!-- Timeline -->
  <line x1="100" y1="125" x2="860" y2="125" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#0d1117">
    <circle cx="100" cy="125" r="20" fill="#38bdf8"/><text x="100" y="131">1</text>
    <circle cx="252" cy="125" r="20" fill="#38bdf8"/><text x="252" y="131">2</text>
    <circle cx="404" cy="125" r="20" fill="#38bdf8"/><text x="404" y="131">3</text>
    <circle cx="556" cy="125" r="20" fill="#a78bfa"/><text x="556" y="131">4</text>
    <circle cx="708" cy="125" r="20" fill="#a78bfa"/><text x="708" y="131">5</text>
    <circle cx="860" cy="125" r="20" fill="#34d399"/><text x="860" y="131">6</text>
  </g>

  <!-- Step cards -->
  <g font-size="13" fill="#9aa4b2">
    <rect x="30" y="165" width="140" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="193" fill="#e6edf3" font-size="16" font-weight="700">Pick</text>
    <text x="44" y="219">Tap C01 and C02.</text>
    <text x="44" y="239">The best-view</text>
    <text x="44" y="259">seats glow.</text>

    <rect x="182" y="165" width="140" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="196" y="193" fill="#e6edf3" font-size="16" font-weight="700">Hold</text>
    <text x="196" y="219">Redis locks every</text>
    <text x="196" y="239">seat or none, in</text>
    <text x="196" y="259">one atomic step.</text>
    <text x="196" y="279" fill="#38bdf8">10 min timer</text>

    <rect x="334" y="165" width="140" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="348" y="193" fill="#e6edf3" font-size="16" font-weight="700">Broadcast</text>
    <text x="348" y="219">A WebSocket</text>
    <text x="348" y="239">greys the seats</text>
    <text x="348" y="259">out for everyone</text>
    <text x="348" y="279">on that show.</text>

    <rect x="486" y="165" width="140" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="500" y="193" fill="#e6edf3" font-size="16" font-weight="700">Pay</text>
    <text x="500" y="219">The hold is</text>
    <text x="500" y="239">checked again,</text>
    <text x="500" y="259">then one booking</text>
    <text x="500" y="279">goes to MongoDB.</text>

    <rect x="638" y="165" width="140" height="130" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="652" y="193" fill="#e6edf3" font-size="16" font-weight="700">Ticket</text>
    <text x="652" y="219">A QR code signed</text>
    <text x="652" y="239">with HMAC. Edit</text>
    <text x="652" y="259">one seat and the</text>
    <text x="652" y="279">signature breaks.</text>

    <rect x="790" y="165" width="140" height="130" rx="12" fill="#161b22" stroke="#34d399"/>
    <text x="804" y="193" fill="#e6edf3" font-size="16" font-weight="700">Gate</text>
    <text x="804" y="219">Staff scan it.</text>
    <text x="804" y="239" fill="#34d399">1st scan: let in</text>
    <text x="804" y="259" fill="#f87171">2nd scan: denied</text>
  </g>

  <!-- What can go wrong -->
  <line x1="252" y1="295" x2="252" y2="338" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)"/>
  <rect x="182" y="340" width="292" height="70" rx="12" fill="#2a1416" stroke="#f87171"/>
  <text x="198" y="368" fill="#fca5a5" font-size="14" font-weight="700">The other 49 get 409 Conflict</text>
  <text x="198" y="392" fill="#9aa4b2" font-size="13">They pick another seat. No double booking.</text>

  <line x1="556" y1="295" x2="556" y2="338" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amber)"/>
  <rect x="486" y="340" width="444" height="70" rx="12" fill="#2a2210" stroke="#fbbf24"/>
  <text x="502" y="368" fill="#fcd34d" font-size="14" font-weight="700">Didn't pay within 10 minutes?</text>
  <text x="502" y="392" fill="#9aa4b2" font-size="13">The hold expires, the seats free up, and a late payment gets 410 Gone.</text>
</svg>

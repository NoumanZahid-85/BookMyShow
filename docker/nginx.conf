# Upstream cluster using least_conn algorithm
upstream backend_cluster {
    least_conn;
    server ${BACKEND_HOST};
    keepalive 64;
}

# Rate limiting zone: 50 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# In-Memory Cache Zone for Static Catalog Data (Cities & Cinemas)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        application/xml;

    # 1. Real-Time WebSocket Streaming Endpoint (Zero Buffering, Protocol Upgrade)
    location ~* ^/api/v1/shows/.+/seats/stream$ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 2. Static Catalog Micro-Caching (Cities & Cinemas)
    # Highly suitable: Read-heavy, static lists, offloads 90% of MongoDB queries
    location ~* ^/api/v1/(cities|cinemas) {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 3. Dynamic & Real-Time Endpoints (Seat Holds, Maps, Payments, Tickets, Auth)
    # Strictly BYPASS cache: Must never cache dynamic locks or user sensitive data
    location ~* ^/api/v1/(shows/.+/seats|shows/.+/hold|shows/.+/release|shows/.+/confirm|auth|payments|tickets|bookings) {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Cache-Status "BYPASS";
    }

    # 4. Default Fallback
    location / {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check for Nginx itself
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}

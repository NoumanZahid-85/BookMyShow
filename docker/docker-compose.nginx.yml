version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: bms-nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
